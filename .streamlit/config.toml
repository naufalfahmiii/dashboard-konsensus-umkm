[server]
enableStaticServing = true
maxUploadSize = 50

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#3B5BDB"
backgroundColor = "#F6F8FC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1F2A44"
font = "pjs"
headingFont = "pjs"

[[theme.fontFaces]]
family = "pjs"
url = "app/static/pjs-400.woff2"
weight = 400

[[theme.fontFaces]]
family = "pjs"
url = "app/static/pjs-500.woff2"
weight = 500

[[theme.fontFaces]]
family = "pjs"
url = "app/static/pjs-600.woff2"
weight = 600

[[theme.fontFaces]]
family = "pjs"
url = "app/static/pjs-700.woff2"
weight = 700

[[theme.fontFaces]]
family = "pjs"
url = "app/static/pjs-800.woff2"
weight = 800
